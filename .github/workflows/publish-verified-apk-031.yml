name: Upload verified signed APK 0.31
'on':
  push:
    branches: [codex/verified-apk-release-031]
    paths: [verified-apk-031-manifest.json]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reassemble and upload the already signed artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,http.client,json,os,pathlib,time,urllib.error,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='gkggl3616-jpg/wolfd-rogue-blood'
          api='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'verified-wolf-apk-release'}
          def get(url,wait_for_segment=False):
              for attempt in range(180 if wait_for_segment else 1):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=120) as response:return json.load(response)
                  except urllib.error.HTTPError as error:
                      if not wait_for_segment or error.code!=404:raise
                      if attempt%12==0:print('Waiting for the next verified segment',flush=True)
                      time.sleep(5)
              raise RuntimeError('Segment upload did not finish in time')
          entry=get(api+'/contents/verified-apk-031-manifest.json?ref='+os.environ['GITHUB_SHA'])
          manifest=json.loads(base64.b64decode(entry['content']))
          expected='6482430f3cc0af9fb8a5b9bb776846eb564ec2e0f52b1428189fa40174632bd0'
          assert manifest['sha256']==expected and manifest['bytes']==1688778550
          assert manifest['releaseId']==439035016 and manifest['sourceCommit']=='d9339687502e2c843d684b174bfcf274ede5bfcb'
          release=get(api+'/releases/'+str(manifest['releaseId']))
          assert release['draft'] and release['tag_name']=='v0.31.0-offline-test' and release['target_commitish']==manifest['sourceCommit']
          name='WolfRogueBlood-0.31.0-test.apk';artifact=pathlib.Path(name);digest=hashlib.sha256();total=0
          with artifact.open('xb') as output:
              for index,chunk in enumerate(manifest['chunks']):
                  assert len(chunk['sha'])==40 and all(c in '0123456789abcdef' for c in chunk['sha'])
                  blob=get(api+'/git/blobs/'+chunk['sha'],True);assert blob['encoding']=='base64'
                  raw=base64.b64decode(blob['content']);assert len(raw)==chunk['bytes']
                  assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==chunk['sha']
                  output.write(raw);digest.update(raw);total+=len(raw)
                  print('Verified segment',index+1,'/',len(manifest['chunks']),flush=True)
          assert total==manifest['bytes'] and digest.hexdigest()==expected
          report=pathlib.Path('WolfRogueBlood-0.31.0-test.validation.json');report.write_bytes(base64.b64decode(manifest['reportBase64']))
          proof=json.loads(report.read_bytes());assert proof['sha256']==expected and proof['signatureVerified'] and proof['bytes']==total
          checksum=pathlib.Path(name+'.sha256');checksum.write_text(expected+'  '+name+'\n')
          def upload(path,content_type):
              existing=[a for a in get(api+'/releases/'+str(manifest['releaseId']))['assets'] if a['name']==path.name]
              local=hashlib.sha256(path.read_bytes()).hexdigest() if path!=artifact else expected
              if existing:
                  assert len(existing)==1 and existing[0]['state']=='uploaded' and existing[0]['size']==path.stat().st_size and existing[0]['digest']=='sha256:'+local
                  return
              connection=http.client.HTTPSConnection('uploads.github.com',timeout=1200)
              route='/repos/'+repo+'/releases/'+str(manifest['releaseId'])+'/assets?name='+urllib.parse.quote(path.name)
              request_headers=dict(headers,**{'Content-Type':content_type,'Content-Length':str(path.stat().st_size)})
              with path.open('rb') as stream:connection.request('POST',route,body=stream,headers=request_headers)
              response=connection.getresponse();body=response.read();assert response.status==201,(response.status,body[:500])
              asset=json.loads(body);assert asset['size']==path.stat().st_size and asset['digest']=='sha256:'+local
              print('Uploaded and verified',path.name,asset['size'],asset['digest'],flush=True)
              connection.close()
          upload(artifact,'application/vnd.android.package-archive');upload(report,'application/json');upload(checksum,'text/plain')
          print('All assets verified; release remains draft for final publication.',flush=True)
          PY
